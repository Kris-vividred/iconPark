<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="24×24 그리드로 그린 무료 라인·채움 아이콘 모음">
<title>iconPark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>try{const t=localStorage.getItem('iconpark-theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky search bar → centred headline → sponsor slot → filter row → dense icon grid → pager → footer */
:root{
  /* tokens mirror the Figma "iconPark" collection: color/* = --*, radius/md|lg|pill = --radius-*, Overlay/Dim style = --overlay */
  --bg:#ffffff; --fg:#0b0b0c; --muted:#6b6d73; --line:#e6e6e8; --tile:#f5f5f6; --tile-hover:#ececee;
  --accent:#0b0b0c; --on-accent:#ffffff; --fav:#e0245e; --overlay:rgba(10,10,12,.45);
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius-md:10px; --radius-lg:16px; --radius-pill:999px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e10; --fg:#f2f2f3; --muted:#9a9ca3; --line:#26262a; --tile:#17171a; --tile-hover:#202024;
  --accent:#f2f2f3; --on-accent:#0e0e10; --fav:#ff4d82; --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e10; --fg:#f2f2f3; --muted:#9a9ca3; --line:#26262a; --tile:#17171a; --tile-hover:#202024;
  --accent:#f2f2f3; --on-accent:#0e0e10; --fav:#ff4d82; --overlay:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;font-weight:500;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1232px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
a{color:inherit}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;letter-spacing:-.02em;font-size:20px;text-decoration:none;white-space:nowrap}
.logo svg{width:22px;height:25px}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;width:20px;height:20px;transform:translateY(-50%);pointer-events:none}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--tile);color:var(--fg);font:inherit;font-size:16px;padding:0 16px 0 42px}
.search input::placeholder{color:var(--muted)}
.suggest{position:absolute;top:50px;left:0;right:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:0 10px 30px rgba(0,0,0,.12);list-style:none;margin:0;padding:6px;max-height:300px;overflow:auto}
.suggest li{padding:8px 12px;border-radius:6px;cursor:pointer}
.suggest li[aria-selected="true"],.suggest li:hover{background:var(--tile-hover)}
.suggest mark{background:none;color:var(--fg);font-weight:800}
.navbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:var(--radius-pill);white-space:nowrap}
.navbtn:hover{background:var(--tile)}
.navbtn svg{width:20px;height:20px}
.navbtn .count{font-size:12px;background:var(--fg);color:var(--bg);border-radius:var(--radius-pill);padding:0 7px;line-height:18px}

/* hero */
.hero{text-align:center;padding-block:44px 28px;min-height:93px}
.hero h1{font-size:clamp(24px,4.2vw,36px);font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:0;text-wrap:balance}
.hero h1 button{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px;font-weight:800}
.hero p{margin:10px 0 0;font-size:18px;font-weight:700}
.hero p button{text-decoration:underline;text-underline-offset:4px;font-weight:700}

/* sponsor slot */
.sponsor{display:flex;gap:16px;align-items:center;max-width:560px;margin:0 auto;border-block:1px solid var(--line);padding-block:16px}
.sponsor .ph{flex:none;width:130px;height:100px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.3}
.sponsor b{display:block;font-size:15px}
.sponsor small{color:var(--muted)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-block:28px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:var(--radius-pill);font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-pill);padding:3px}
.seg button{height:28px;padding:0 12px;border-radius:var(--radius-pill);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg.theme{flex:none}
.seg.theme button{display:inline-flex;align-items:center;gap:4px}
.seg.theme svg{width:20px;height:20px;flex:none}
.theme-ico{display:none;flex:none;width:40px;padding:0;justify-content:center}
.status{color:var(--muted);font-size:14px;padding-block:4px 12px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;list-style:none;margin:0;padding:0}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;aspect-ratio:1/1;max-width:100%;border-radius:var(--radius-md);padding:12px;position:relative;transition:background .15s}
.cell:hover{background:var(--tile)}
.cell svg.ic{width:56px;height:56px}
.cell .meta{font-size:13px;color:var(--muted);text-align:center;line-height:1.3}
.cell .meta b{display:block;color:var(--fg);font-weight:500;font-size:13px}
.cell .heart{position:absolute;top:10px;right:10px;width:16px;height:16px;color:var(--fav)}
.empty{text-align:center;padding-block:64px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:4px}

/* pager */
.pager{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;padding-block:32px 48px}
.pager button{min-width:40px;height:40px;border-radius:var(--radius-pill);font-weight:700;font-variant-numeric:tabular-nums}
.pager button:hover{background:var(--tile)}
.pager button[aria-current="page"]{background:var(--fg);color:var(--bg)}
.pager span{align-self:center;color:var(--muted);padding:0 4px}

/* footer */
footer{border-top:1px solid var(--line)}
.foot{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding-block:28px}
.foot nav{display:flex;flex-wrap:wrap;gap:4px 20px}
.foot nav button{font-weight:700;font-size:15px}
.foot nav button:hover{text-decoration:underline}
.foot small{color:var(--muted)}

/* dialog */
dialog{border:0;padding:0;background:var(--bg);color:var(--fg);border-radius:var(--radius-lg);width:min(760px,calc(100% - 32px));max-height:calc(100% - 32px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:var(--overlay)}
.dlg{display:grid;grid-template-columns:1fr 1fr;min-height:0}
.dlg>*{min-width:0}
.preview{background:var(--tile);display:grid;place-items:center;padding:40px;border-radius:var(--radius-lg) 0 0 var(--radius-lg);position:relative}
.preview svg{width:min(200px,60%);height:auto;aspect-ratio:1}
.preview img{width:min(200px,60%);height:auto;image-rendering:auto;border-radius:8px;
  /* transparency checkerboard so any icon colour stays visible in both themes */
  background:conic-gradient(#e4e4e7 25%,#fafafa 0 50%,#e4e4e7 0 75%,#fafafa 0) 0 0/16px 16px}
.preview .px{position:absolute;bottom:12px;left:0;right:0;text-align:center;font:400 12px var(--mono);color:var(--muted)}
.side{padding:40px 28px;display:flex;flex-direction:column;gap:30px}
.side h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.side .sub{color:var(--muted);font-size:14px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{font-size:13px;border:1px solid var(--line);border-radius:var(--radius-pill);padding:2px 10px}
.tags button:hover{background:var(--tile)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.lbl{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
select,input[type=color]{font:inherit;font-size:14px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 8px}
input[type=color]{width:40px;height:28px;border-radius:6px;padding:2px}
.btn{height:44px;padding:0 18px;border-radius:var(--radius-pill);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{border:1px solid var(--line)}
.btn.ghost:hover{background:var(--tile)}
.btn svg{width:18px;height:18px}
.btn.fav[aria-pressed="true"]{color:var(--fav);border-color:var(--fav)}
pre.code{margin:0;background:var(--tile);border-radius:var(--radius-md);padding:12px;font:400 12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:130px;overflow:auto}
.license{font-size:13px;color:var(--muted);margin:0}
.license button{text-decoration:underline}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:var(--radius-pill);display:grid;place-items:center;z-index:2;background:var(--bg)}
.close svg{width:20px;height:20px}
/* toast is a manual popover so it joins the top layer above an open modal <dialog> and its backdrop */
.toast{position:fixed;inset:auto;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:0;border:0;overflow:visible;width:max-content;max-width:calc(100vw - 32px);text-align:center;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:var(--radius-pill);font-weight:700;font-size:14px;z-index:60}
.info{padding:40px 32px;max-width:62ch}
.info h2{margin:0 0 12px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.info p,.info li{color:var(--fg);font-weight:400;line-height:1.65}
.info dt{font-weight:700;margin-top:14px}
.info dd{margin:2px 0 0;font-weight:400;color:var(--muted)}

@media (max-width:640px){
  .logo span{display:none}
  .navbtn .lbl-t{display:none}
  .seg.theme{display:none}
  .theme-ico{display:flex}
  .dlg{grid-template-columns:1fr}
  .preview{border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:28px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px}
  .cell svg.ic{width:44px;height:44px}
  .sponsor .ph{width:96px;height:74px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

  <div class="wrap bar">

      <svg viewBox="0 0 22 25" fill="currentColor" stroke="currentColor" stroke-width=".8" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M21 17.7921C21 18.2202 20.7811 18.6146 20.4289 18.8211C18.6567 19.8651 13.2678 23.0353 11.5389 24.0515C11.3933 24.1385 11.2322 24.1884 11.0689 24.1976C10.8611 24.2116 10.65 24.164 10.4611 24.0515C8.73222 23.0353 3.34333 19.8651 1.57222 18.8211C1.21889 18.6146 1 18.2202 1 17.7921L1 7.40899C1 6.98095 1.21889 6.58655 1.57222 6.38007C3.34333 5.33723 8.73222 2.16464 10.4611 1.14848C10.6289 1.04988 10.8144 1 11 1C11.1856 1 11.3711 1.04988 11.5389 1.14848C13.2678 2.16464 18.6567 5.33723 20.4289 6.38007C20.7811 6.58655 21 6.98095 21 7.40899V17.7921ZM19.3333 7.73263L11 2.82816L2.66667 7.73263L2.66667 17.4685L11 22.3718L19.3333 17.4685V7.73263Z"/><path d="M12.0854 11.6187C11.3285 11.421 10.8373 11.2232 10.55 11.0132C10.4079 10.9081 10.3152 10.8031 10.2596 10.6919C10.2009 10.5806 10.1761 10.4602 10.1761 10.3119C10.1761 10.0246 10.2935 9.79903 10.5345 9.61985C10.7755 9.44375 11.1586 9.32635 11.6683 9.32635C12.4345 9.32635 13.2068 9.55188 13.8278 9.91025C13.8711 9.93496 13.9236 9.94114 13.9699 9.92261C14.0163 9.90716 14.0533 9.87009 14.075 9.82375L14.6681 8.37791C14.699 8.30067 14.6681 8.21108 14.6002 8.16783C13.9143 7.7384 12.9628 7.37076 11.4366 7.37076C10.3399 7.37076 9.42233 7.64881 8.77356 8.17092C8.1217 8.69303 7.75097 9.4592 7.75406 10.3798C7.75406 11.2109 7.96105 11.8844 8.4121 12.4034C8.86624 12.9193 9.54282 13.2684 10.4573 13.5094C11.2821 13.7257 11.7579 13.9141 11.9958 14.1057C12.1163 14.2014 12.1812 14.2941 12.2244 14.4022C12.2677 14.5104 12.2831 14.6463 12.2831 14.8162C12.2831 15.1777 12.1657 15.4186 11.9433 15.5917C11.7178 15.7647 11.3532 15.8697 10.8435 15.8697C10.0433 15.8697 9.16282 15.6967 8.19275 15.2147C8.1495 15.1931 8.10007 15.19 8.05682 15.2086C8.01356 15.224 7.97649 15.258 7.95796 15.3012L7.32463 16.7749C7.29065 16.8521 7.31845 16.9448 7.3926 16.9881C8.37194 17.5905 9.7807 17.8809 10.8991 17.8809C12.0978 17.8809 13.0586 17.5843 13.7259 17.0251C14.3932 16.466 14.7485 15.6473 14.7485 14.6648C14.7485 13.9728 14.6249 13.3395 14.214 12.8143C13.8062 12.2891 13.1327 11.8936 12.0854 11.6187Z"/></svg>
      <span>iconPark</span>

    <form class="search" id="search-form" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="아이콘 검색 … (예: heart, 메일)" autocomplete="off" maxlength="60" aria-label="아이콘 검색" aria-autocomplete="list" aria-controls="suggest">

</header>

<main>
  <section class="wrap hero">
    <h1 id="headline" hidden></h1>
    <p hidden>새로 나온 아이콘이 궁금하다면? <button id="whatsnew">업데이트 보기</button></p>
  </section>

  <div class="wrap">

const COLL={interface:'인터페이스',communication:'커뮤니케이션',media:'미디어',commerce:'커머스',weather:'날씨',navigation:'내비게이션'};

/* expand into lined + filled variants with example release dates (newest first) */
const NOW=new Date('2026-11-19');
const ALL=[];
ICONS.forEach((ic,i)=>{
  ['lined','filled'].forEach((s,j)=>{
    const days=Math.floor(i*19.3+j*2);
    ALL.push({id:`${ic.n}-${s}`,base:ic,style:s,days,date:new Date(NOW-days*864e5)});
  });
});
const COLL_COUNT=new Set(ICONS.map(i=>i.c)).size;

const svgFor=(v,color='currentColor',size=24)=>{
  const inner=v.style==='lined'?v.base.L:v.base.F;
  const attrs=v.style==='lined'
    ?`fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`
    :`fill="${color}"`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" ${attrs}>${inner.replaceAll('currentColor',color)}</svg>`;
};
const ago=d=>d<1?'오늘':d<30?`${d}일 전`:d<365?`${Math.floor(d/30)}개월 전`:`${Math.floor(d/365)}년 전`;
const title=v=>v.base.n.replace(/-/g,' ').replace(/\b\w/g,m=>m.toUpperCase())+' – '+(v.style==='lined'?'Lined':'Filled');

/* ---------- state ---------- */
const PER=24;
const st={q:'',coll:'all',style:'all',page:1,favOnly:false};
let favs=new Set();
/* favourites key was 'monoline-favs' before the iconPark rename: read it once and move it over */
try{const raw=localStorage.getItem('iconpark-favs')??localStorage.getItem('monoline-favs');favs=new Set(JSON.parse(raw||'[]'))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('iconpark-favs',JSON.stringify([...favs]));localStorage.removeItem('monoline-favs')}catch(e){}};
try{if(localStorage.getItem('monoline-favs')!==null)saveFavs()}catch(e){}

const $=s=>document.querySelector(s);

/* ---------- theme switch (Light / Dark) ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
const curTheme=()=>document.documentElement.dataset.theme||(mq.matches?'dark':'light');
/* mobile (≤640px) shows one icon button instead: moon in light theme, sun in dark theme */
const ICO_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const ICO_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function syncTheme(){
  const cur=curTheme();
  $('#theme').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===cur));
  const ico=$('#theme-ico');ico.innerHTML=cur==='dark'?ICO_SUN:ICO_MOON;
  ico.setAttribute('aria-label',cur==='dark'?'라이트 모드로 전환':'다크 모드로 전환');
}
function setTheme(t){const root=document.documentElement;root.dataset.theme=t;root.style.colorScheme=t;
  try{localStorage.setItem('iconpark-theme',t)}catch(err){}syncTheme()}
$('#theme').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t)});
$('#theme-ico').addEventListener('click',()=>setTheme(curTheme()==='dark'?'light':'dark'));
mq.addEventListener('change',syncTheme);syncTheme();
const grid=$('#grid'),pager=$('#pager'),statusEl=$('#status');

$('#headline').innerHTML=`<span>${ALL.length}개 이상의 무료 아이콘, ${COLL_COUNT}개 </span><button id="coll-link">컬렉션</button>`;

/* chips */
const chips=$('#chips');
[['all','전체'],...Object.entries(COLL)].forEach(([k,v])=>{
  const b=document.createElement('button');b.className='chip';b.dataset.c=k;b.textContent=v;b.setAttribute('aria-pressed',k==='all');
  b.onclick=()=>{st.coll=k;st.page=1;st.favOnly=false;render()};chips.append(b);
});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.style=b.dataset.s;st.page=1;render()});
$('#coll-link').onclick=()=>{chips.scrollIntoView({behavior:'smooth',block:'center'});chips.querySelector('[data-c="interface"]').focus()};
$('#whatsnew').onclick=()=>{Object.assign(st,{q:'',coll:'all',style:'all',page:1,favOnly:false});$('#q').value='';render();grid.scrollIntoView({behavior:'smooth'})};
$('#home-link').onclick=e=>{e.preventDefault();$('#whatsnew').click();window.scrollTo({top:0})};
$('#fav-btn').onclick=()=>{st.favOnly=!st.favOnly;st.page=1;render()};

const match=(v,q)=>{if(!q)return true;q=q.toLowerCase();const b=v.base;return [b.n,b.ko,COLL[b.c],...b.t,v.style].some(s=>s.toLowerCase().includes(q))};

function filtered(){
  return ALL.filter(v=>(st.coll==='all'||v.base.c===st.coll)&&(st.style==='all'||v.style===st.style)&&match(v,st.q)&&(!st.favOnly||favs.has(v.id)));
}

function render(){
  chips.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===st.coll&&!st.favOnly));
  $('#seg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===st.style));
  $('#fav-btn').setAttribute('aria-pressed',st.favOnly);
  $('#fav-count').textContent=favs.size;
  const list=filtered();const pages=Math.max(1,Math.ceil(list.length/PER));st.page=Math.min(st.page,pages);
  const slice=list.slice((st.page-1)*PER,st.page*PER);
  const parts=[];if(st.favOnly)parts.push('즐겨찾기');if(st.coll!=='all')parts.push(COLL[st.coll]);if(st.q)parts.push(`“${st.q}”`);
  statusEl.textContent=`${parts.length?parts.join(' · ')+' — ':''}아이콘 ${list.length}개`;
  grid.innerHTML='';
  if(!slice.length){
    grid.innerHTML=st.favOnly?`<li class="empty" style="grid-column:1/-1"><b>즐겨찾기한 아이콘이 없습니다</b>아이콘을 열고 ‘즐겨찾기’를 누르면 여기에 모입니다.</li>`
      :`<li class="empty" style="grid-column:1/-1"><b>“${st.q}”에 맞는 아이콘이 없습니다</b>영문 이름이나 다른 단어로 검색해 보세요. 예: mail, 날씨, arrow</li>`;
  }
  slice.forEach(v=>{
    const li=document.createElement('li');
    li.innerHTML=`<button class="cell" aria-label="${title(v)} 열기">${favs.has(v.id)?`<svg class="heart" viewBox="0 0 24 24" fill="currentColor"><path d="${HEART}"/></svg>`:''}${svgFor(v).replace('<svg ','<svg class="ic" aria-hidden="true" ')}<span class="meta"><b>${v.base.n}</b>${ago(v.days)}</span></button>`;
    li.firstChild.onclick=()=>openIcon(v);
    grid.append(li);
  });
  // pager
  pager.innerHTML='';
  if(pages>1){
    const nums=new Set([1,pages,st.page-1,st.page,st.page+1].filter(n=>n>=1&&n<=pages));
    let prev=0;[...nums].sort((a,b)=>a-b).forEach(n=>{
      if(n-prev>1)pager.insertAdjacentHTML('beforeend','<span>…</span>');
      const b=document.createElement('button');b.textContent=n;if(n===st.page)b.setAttribute('aria-current','page');
      b.onclick=()=>{st.page=n;render();window.scrollTo({top:grid.offsetTop-90,behavior:'smooth'})};pager.append(b);prev=n;
    });
  }
}

/* ---------- search + autocomplete ---------- */
const q=$('#q'),sug=$('#suggest');
const KEYWORDS=[...new Set(ICONS.flatMap(i=>[i.n,i.ko,...i.t]))].sort();
let sel=-1;
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();sel=-1;
  st.q=q.value.trim();st.page=1;st.favOnly=false;render();
  if(v.length<1){sug.hidden=true;return}
  const hits=KEYWORDS.filter(k=>k.toLowerCase().includes(v)).slice(0,8);
  if(!hits.length){sug.hidden=true;return}
  sug.innerHTML=hits.map((k,i)=>{const at=k.toLowerCase().indexOf(v);return `<li role="option" id="s${i}" data-k="${k}" aria-selected="false">${k.slice(0,at)}<mark>${k.slice(at,at+v.length)}</mark>${k.slice(at+v.length)}</li>`}).join('');
  sug.hidden=false;
});
const pick=k=>{q.value=k;st.q=k;st.page=1;sug.hidden=true;render()};
sug.addEventListener('mousedown',e=>{const li=e.target.closest('li');if(li){e.preventDefault();pick(li.dataset.k)}});
q.addEventListener('keydown',e=>{
  const items=[...sug.querySelectorAll('li')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(sug.hidden||!items.length)return;e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items.forEach((li,i)=>li.setAttribute('aria-selected',i===sel));q.setAttribute('aria-activedescendant','s'+sel)}
  else if(e.key==='Enter'){if(sel>=0&&!sug.hidden){e.preventDefault();pick(items[sel].dataset.k)}}
  else if(e.key==='Escape'){sug.hidden=true}
});
q.addEventListener('blur',()=>setTimeout(()=>sug.hidden=true,100));
$('#search-form').addEventListener('submit',e=>{e.preventDefault();sug.hidden=true;grid.scrollIntoView({behavior:'smooth'})});

/* ---------- detail dialog ---------- */
const dlg=$('#dlg');let cur=null,fmt='svg',mode='svg';
function openIcon(v){
  cur=v;fmt='svg';mode='svg';
  $('#d-name').textContent=title(v);
  $('#d-sub').textContent=`${COLL[v.base.c]} 컬렉션 · ${v.date.toISOString().slice(0,10)} 공개 · ${v.base.ko}`;
  $('#d-tags').innerHTML=v.base.t.map(t=>`<button>${t}</button>`).join('');
  $('#d-tags').querySelectorAll('button').forEach(b=>b.onclick=()=>{dlg.close();q.value=b.textContent;q.dispatchEvent(new Event('input'));sug.hidden=true});
  updateDetail();dlg.showModal();
}
function colorVal(){return $('#d-color').value}
function updateDetail(){
  const v=cur,color=colorVal();
  $('#d-fmt').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===fmt));
  $('#d-size-wrap').hidden=fmt!=='png';
  const fav=favs.has(v.id);$('#d-fav').setAttribute('aria-pressed',fav);
  $('#d-fav').lastChild.textContent=fav?'즐겨찾기됨':'즐겨찾기';
  $('#d-fav svg').setAttribute('fill',fav?'currentColor':'none');
  const svg=svgFor(v,color);
  const prev=$('#d-preview');
  if(fmt==='svg'){
    prev.innerHTML=svgFor(v,color==='#000000'?'currentColor':color)+`<div class="px">24 × 24 · SVG</div>`;
    $('#d-copy span').textContent='SVG 복사';$('#d-b64').hidden=false;
    $('#d-dl span').textContent='SVG 다운로드';
    $('#d-code').textContent=mode==='b64'?`<img src="data:image/svg+xml;base64,${btoa(svg)}" alt="${v.base.n}">`:svg;
  }else{
    const size=+$('#d-size').value;
    const img=new Image();img.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(img,0,0,size,size);
      const url=c.toDataURL('image/png');
      prev.innerHTML=`<img src="${url}" alt="${title(v)} PNG ${size}px"><div class="px">${size} × ${size} · PNG</div>`;
      $('#d-code').textContent=`<img src="data:image/png;base64,${url.split(',')[1].slice(0,60)}…" width="${size}">`;
      cur._png=url;
    };
    img.src='data:image/svg+xml;base64,'+btoa(svgFor(v,color,size));
    $('#d-copy span').textContent='PNG 데이터 복사';$('#d-b64').hidden=true;
    $('#d-dl span').textContent=`PNG ${size}px 다운로드`;
  }
}
const toPng=(v,color,size)=>new Promise((res,rej)=>{
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(img,0,0,size,size);c.toBlob(b=>b?res(b):rej(new Error('png')),'image/png')};
  img.onerror=rej;img.src='data:image/svg+xml;base64,'+btoa(svgFor(v,color,size));
});
function saveBlob(blob,name){
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$('#d-dl').onclick=async()=>{
  const v=cur,color=colorVal(),btn=$('#d-dl');
  btn.disabled=true;
  try{
    if(fmt==='svg'){
      saveBlob(new Blob([svgFor(v,color)],{type:'image/svg+xml'}),`iconpark-${v.id}.svg`);
      toast(`iconpark-${v.id}.svg 저장을 시작했습니다`);
    }else{
      const size=+$('#d-size').value;
      saveBlob(await toPng(v,color,size),`iconpark-${v.id}-${size}.png`);
      toast(`iconpark-${v.id}-${size}.png 저장을 시작했습니다`);
    }
  }catch(e){toast('파일을 만들지 못했습니다. 다시 눌러 주세요')}
  finally{btn.disabled=false}
};
$('#d-fmt').addEventListener('click',e=>{const b=e.target.closest('button');if(b){fmt=b.dataset.f;updateDetail()}});
$('#d-size').onchange=updateDetail;$('#d-color').oninput=updateDetail;
$('#d-b64').onclick=()=>{mode=mode==='b64'?'svg':'b64';$('#d-b64').textContent=mode==='b64'?'인라인':'Base64';updateDetail()};
$('#d-copy').onclick=async()=>{
  const text=fmt==='svg'?$('#d-code').textContent:cur._png;
  try{await navigator.clipboard.writeText(text);toast(fmt==='svg'?(mode==='b64'?'Base64 코드를 복사했습니다':'SVG 코드를 복사했습니다'):'PNG 데이터 URL을 복사했습니다')}
  catch(e){const r=document.createRange();r.selectNodeContents($('#d-code'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('코드를 선택했습니다. ⌘C로 복사하세요')}
};
$('#d-fav').onclick=()=>{favs.has(cur.id)?favs.delete(cur.id):favs.add(cur.id);saveFavs();updateDetail();render();toast(favs.has(cur.id)?'즐겨찾기에 추가했습니다':'즐겨찾기에서 뺐습니다')};
$('#d-close').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

/* ---------- info dialogs ---------- */
const INFO={
  about:`<h2>소개</h2><p>iconPark은 24×24 그리드와 2px 스트로크 규칙으로 그린 단순한 아이콘 모음입니다. 아이콘마다 라인과 채움 두 가지 스타일이 있고, SVG 코드나 원하는 크기의 PNG로 가져갈 수 있습니다.</p>`,
  qa:`<h2>Q&amp;A</h2><dl><dt>출처 표기가 필요한가요?</dt><dd>아니요. 표기 없이 써도 됩니다.</dd><dt>색을 바꿀 수 있나요?</dt><dd>상세 창의 색상에서 바꾸거나, SVG의 stroke·fill 값을 직접 수정하세요.</dd><dt>즐겨찾기는 어디에 저장되나요?</dt><dd>지금 쓰는 브라우저에만 저장됩니다. 다른 기기와는 공유되지 않습니다.</dd></dl>`,
  license:`<h2>라이선스</h2><p>개인·상업 프로젝트에 무료로 쓸 수 있고 출처 표기는 필요 없습니다.</p><ul><li>웹사이트, 앱, 인쇄물, 영상 등 어디에든 쓸 수 있습니다.</li><li>아이콘을 그대로 묶어 아이콘 팩으로 다시 팔거나 배포할 수는 없습니다.</li><li>아이콘을 상표나 로고의 핵심 요소로 등록할 수 없습니다.</li></ul>`,
  privacy:`<h2>개인정보</h2><p>이 페이지는 계정이나 쿠키를 쓰지 않습니다. 즐겨찾기 목록만 브라우저 저장소(localStorage)에 보관하며 서버로 보내지 않습니다.</p>`
};
const info=$('#info');
document.addEventListener('click',e=>{const b=e.target.closest('[data-info]');if(!b)return;if(dlg.open)dlg.close();$('#info-body').innerHTML=INFO[b.dataset.info];info.showModal()});
$('#i-close').onclick=()=>info.close();
info.addEventListener('click',e=>{if(e.target===info)info.close()});

let tt;function toast(m){
  const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);
  if(t.showPopover){try{t.hidePopover()}catch(e){}t.showPopover()} // re-show so it sits above the latest dialog
  else{(document.querySelector('dialog[open]')||document.body).append(t)} // fallback: render inside the open dialog
  tt=setTimeout(()=>{if(t.hidePopover)try{t.hidePopover()}catch(e){}t.hidden=true},1800);
}

render();
})();
</script>
</body>
</html>
